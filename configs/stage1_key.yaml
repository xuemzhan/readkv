# 阶段 1：对称 key 目标（先写判据后跑）
pair: 17b_to_06b
confirm_pairs: [8b_to_06b]
seeds: [0, 1, 2]
n_eval_questions: 56
n_test_docs: 8
n_resamples: 10000
remote_rope: true           # 先在 de-RoPE 内容空间闭式拟合

objectives:
  A_affine_ridge:
    type: representation
    lambda: 0.001
  B_attention_weighted:
    type: representation
    lambda: 0.001
    weight: student_attention_mass
  C_score_regression:
    type: consumer
    lambda: 0.001
    target: pre_softmax_scores      # Q_S (M K_hat^T) -> Q_S K_S^T
    gqa: stack_query_heads
  D_shuffled_target:
    type: consumer
    target_document: different
  E_attention_kl:
    type: sgd
    enabled: true
    lr: 0.001
    epochs: 20

value_side: consumer_space_mapper   # 固定，使 Joint 臂有意义
positive_rule: "C K-only EM >= 0.15 mean, doc-cluster CI excludes A/B, D not better than C"
negative_rule: "C ~ A/B/D and routing improves while EM does not"
