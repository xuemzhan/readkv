# ============================================================
# 新增版本判据文件（protocol-v2.2）—— 仅登记 Huber δ 最终值与「不劣于」口径
# 本文件叠加在 v2.1 之上生效：v2.1 的其余冻结项全部保留不动（见 inherited_from_v2_1）。
# 依据：docs/decisions/huber_delta_lock.md（PI 锁定裁决，2026-11-23）、
#       docs/decisions/p1_go_no_go.md §3/§10、reports/engineer_status.md §9。
# ============================================================
version: "2.2"
frozen_at: "protocol-v2.2"
frozen_on: "2026-11-23"
frozen: true
decision_ref: "docs/decisions/huber_delta_lock.md"
supersedes_only:
  - "huber_delta.final_value（由 v2.1 的'待验证集网格锁定'升级为锁定 δ=0.5）"
  - "huber_delta.non_inferiority_interpretation（新增'不劣于'硬护栏口径裁定）"

freeze_rationale: >-
  v2.1 冻结了 δ 的标称值 1.0、网格 {0.5,1.0,2.0} 与选择规则，但明确"最终值须在验证集网格
  选定后锁定"。并行实例 3 补完 δ=2.0 后，三 δ 网格已齐（见 reports/engineer_status.md §9）。
  PI 依冻结规则逐条核对并裁定最终 δ=0.5（详见 docs/decisions/huber_delta_lock.md）。本文件
  由 PI 亲自以新增版本登记该最终值与口径，落实"判据先写后跑"与形式闭环；不回写 v2.1 或任何
  既有 prereg，不触碰主终点 paired_E_CF_difference、τ=1.0、self_threshold=0.1 与统计设计。

# ------------------------------------------------------------
# 本文件唯一新增/覆盖的内容
# ------------------------------------------------------------
huber_delta_final:
  status: "locked_on_validation"
  value: 0.5                       # logit 单位，最终锁定值
  symbol: "δ"
  source: "docs/decisions/huber_delta_lock.md §3（PI 裁决，2026-11-23）"
  unit: "logit"
  applies_to: "L_CF = mean_{Self有效} Huber_δ(D_trans − D_self)"
  selected_from: "验证集 val（60 对）网格 {0.5, 1.0, 2.0}，seed=0，真实 GPU（bf16/sdpa），全程未读封存 test"
  grid_results:                    # 来自 reports/engineer_status.md §9 / reports/huber_delta_lock.json
    - delta: 0.5
      run_id: "delta_lock_v2p1_0p5"
      val_joint_ecf: 2.7496
      val_joint_ecf_ci: [2.0842, 3.4962]
      dual_correct: 0.7000
      flip_consistency: 1.0000
      ordinary_qa_unchanged: true
      rule_check: "满足第 2、3 条（dual/flip 不劣于 kd_only、普通 QA 不退化）；E_CF 非最小 → 锁定"
    - delta: 1.0
      run_id: "delta_lock_v2p1_1p0_par"
      val_joint_ecf: 1.5968         # 网格最小，较 δ=0.5 低约 42%
      val_joint_ecf_ci: [1.2016, 2.0490]
      dual_correct: 0.6500
      flip_consistency: 1.0000
      ordinary_qa_unchanged: true
      rule_check: "违反第 2 条（dual 0.65 < kd_only 0.70）→ 否决"
    - delta: 2.0
      run_id: "delta_lock_v2p1_2p0_par"
      val_joint_ecf: 2.7625
      val_joint_ecf_ci: [2.0009, 3.5967]
      dual_correct: 0.5333
      flip_consistency: 0.9583
      ordinary_qa_unchanged: true
      rule_check: "违反第 2 条（dual 0.533<0.70 且 flip 0.958<1.0，双重劣化）→ 否决"
    reference_kd_only:
      run_id: "p1_gpu_kdonly_mvp_seed0"
      val_joint_ecf: 0.7350
      dual_correct: 0.7000
      flip_consistency: 1.0000
      budget_caveat: "kd_only 为 120 对/8 epoch，δ 网格为 60 对/3 epoch，预算不同，非劣比较仅供初筛"
  selection_rationale: >-
    按 v2.1 selection_rule 固定优先级执行；δ=1.0 虽 E_CF 最小但 dual 跌破硬护栏，δ=2.0 双重劣化，
    δ=0.5 是唯一同时满足第 2、3 条的候选。依 v2.1 final_value_rule"网格最优偏离标称 1.0 时以
    网格结果为准"，锁定 δ=0.5。
  non_inferiority_interpretation:     # PI 口径裁定（本次新增）
    verdict: "hard_guardrail"
    meaning: "「不劣于 kd_only」= dual_correct 与 flip_consistency 不得低于参照（含相等），不引入任何容差"
    rejected_soft_reading: >-
      否决"带容差的软护栏（如 dual_drop<0.2）"解释：v2.1 未预置容差参数，看到结果后加容差
      属按结果改判据（Hard No）；且违背 docs/protocol.md §4.1"低 E_CF 单独不构成改善、须联合报告"的一级原则。
    execution_semantics: >-
      先以第 2、3 条硬护栏筛除不合格候选（可行性约束），再在合格集内按第 1 条选 val E_CF 最小者
      （优化目标）。"第 1 条优先"不等于可为第 1 条牺牲第 2 条。
  forbidden_on_test:
    - "不得按封存测试结果调整 δ 或重跑网格"
    - "不得在封存测试期间改变 L_CF 的 Self 有效掩码"
    - "不得事后把硬护栏改解释为带容差的软护栏"
  caveats_recorded:
    - "三 δ 的 val joint E_CF（2.7496/1.5968/2.7625）全部高于 kd_only（0.735）——本网格内无任何 δ 使主终点方向为正；真实结果，如实记录。"
    - "预算不对等：δ 网格 60 对/3 epoch vs kd_only 120 对/8 epoch，非劣比较仅供初筛。"
    - "δ=0.5 的 dual=0.70、flip=1.0 恰等于参照，为压线满足，非劣证据较弱，须在 P3/审稿中如实披露。"
    - "网格 run git hash 为 ff578b5（δ=1.0）/ a04990d（δ=2.0），系 run 启动 HEAD，跑分代码路径与 458de18 一致；按 ancestry + 代码一致性口径审计，属 R1 闭环待办。"

# ------------------------------------------------------------
# 继承声明：v2.1 其余冻结项全部保留不动
# ------------------------------------------------------------
inherited_from_v2_1:
  file: "configs/prereg/phase3_loss_config_v2.1.yaml"
  note: >-
    以下项目完全沿用 v2.1，本文件不复制、不修改、不覆盖；两者叠加生效时以本文件的
    huber_delta_final 覆盖 v2.1 的 huber_delta 最终值与口径，其余一律以 v2.1 为准。
  retained_verbatim:
    - "label_balance（A/B 1:1、候选顺序 50/50、F5 固定配比、L_CF 仅 Self 有效子集）"
    - "loss_weights（λ_KD=1.0 锚点；λ_CF/λ_local/λ_reg 同验证集/网格/预算选择规则）"
    - "e0_measurement_error_tolerance（测量误差上限 ≤ 效应 1/3；cosine 0.9998 / KL 0.001 / EM 0.929）"
    - "e2_mechanism_prediction（repair 命中率 CI 下界>0、方向一致 ΔE_CF>0 占比>0.5、分解残差≈0）"
    - "e6_cost_threshold（deferred_to_pre_E6，触发时点与待冻结量不变）"
    - "forbidden_after_run（8 条）与 reviewer_checks（4 条）"
  unchanged_from_protocol_v2:
    - "primary_endpoint: paired_E_CF_difference（95% CI 上界 < 0）—— 不回写"
    - "tau: 1.0（validation_only）—— 不回写"
    - "self_threshold: 0.1 —— 不回写"
    - "statistics: cluster_paired bootstrap, 10000 resamples, 95% CI, >=3 seeds, Holm —— 不回写"

# ------------------------------------------------------------
# P3 阶段状态（如实记录，非判据变更）
# ------------------------------------------------------------
p3_status:
  verdict: "NO_GO"
  reason: >-
    δ 最终值锁定仅解除前置条件 (a) 的实质部分；P3 仍因以下问题维持 NO-GO，依据
    docs/decisions/p1_go_no_go.md §1/§10 与 docs/decisions/huber_delta_lock.md §5.2：
  open_items:
    - "R1：git 来源可复现性未闭环（网格 run git hash 为启动时 HEAD；主验证对未按新 hash 重跑）"
    - "R3：kd_only 仅 seed0，三 seed 方差未齐、未按冻结 phase1 判据完成重判"
    - "R4：quality_pass / broken transfer verdict 口径勘误未确认完成"
    - "P2 机制诊断未运行（P3 依赖 P2 闭环）"
    - "审稿第 2 轮未启动（修复完成后触发）"
    - "形式登记（本文件）+ P3 run config 写入 δ=0.5 + 审稿复核尚未全部完成"
  preflight_for_p2: >-
    仍需 R1 闭环 + kd_only 三 seed 补跑且未消除 gap + R4 勘误 + δ 按 v2.1/v2.2 锁定 + P2 机制闭环；
    本网格"三 δ 均不优于 kd_only"仅作 P3 风险预警，P2/P3 未跑不触发 protocol §8 方法降级分支。
